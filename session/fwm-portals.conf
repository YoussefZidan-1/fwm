# Which xdg-desktop-portal backend serves which interface under fwm.
#
# Installed as /usr/share/xdg-desktop-portal/fwm-portals.conf, where the
# frontend reads it whenever XDG_CURRENT_DESKTOP contains "fwm". Not in the
# portals/ subdirectory: that one holds the .portal files that describe
# backends, and a routing config dropped in there is ignored without a word.
#
# ScreenCast and Screenshot must go to xdg-desktop-portal-wlr: it is the only
# backend that speaks wlr-screencopy-v1, the protocol fwm implements. The GTK
# backend answers the ScreenCast interface on paper but captures nothing
# outside GNOME, which is exactly how screen sharing ends up as a black or
# frozen frame instead of an honest error.
#
# Everything else — file chooser, settings, notifications — stays with GTK,
# which is what has the dialogs.

[preferred]
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
default=gtk;*
